# Karaoke plugin conformance gate.
# Runs sdktest golden vectors against the SDK contract on every push, pull
# request and tagged release, plus a weekly scheduled run. The SDK resolves
# from the tagged go.mod requirement unless a manual run supplies an sdk_ref
# override.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'plugin-sdk ref to test against'
        required: false
        type: string

jobs:
  fast-conformance:
    name: fast conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-karaoke
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-karaoke/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-karaoke
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: gofmt
        working-directory: beamfall-plugin-karaoke
        run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - name: vet
        working-directory: beamfall-plugin-karaoke
        run: go vet ./...
      - name: conformance + coverage floor
        working-directory: beamfall-plugin-karaoke
        run: script/gate.sh coverage
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.12.2
          working-directory: beamfall-plugin-karaoke

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-karaoke
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-karaoke/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-karaoke
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: race
        working-directory: beamfall-plugin-karaoke
        run: script/gate.sh race

  conformance:
    name: conformance
    needs: [fast-conformance, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast and race jobs
        env:
          FAST_RESULT: ${{ needs.fast-conformance.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RACE_RESULT" = success

  fuzz:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-karaoke
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-karaoke/go.mod
      - name: bounded parser fuzz
        working-directory: beamfall-plugin-karaoke
        env:
          FUZZ_TIME: 20s
        run: script/gate.sh fuzz
